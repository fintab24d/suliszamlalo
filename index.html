<!DOCTYPE html>
<html lang="hu" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suli Időzítő - Órák és Szünetek</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="logo">
            <i class="fa-solid fa-stopwatch"></i> Suli Időzítő
        </div>
        <div class="header-controls">
            <select id="theme-select" onchange="changeTheme(this.value)">
                <option value="dark">🌙 Sötét</option>
                <option value="light">☀️ Világos</option>
                <option value="blue">🌊 Kék</option>
            </select>
            <button class="btn btn-outline" onclick="openAdminModal()" id="admin-login-btn">
                <i class="fa-solid fa-lock"></i> Admin
            </button>
            <button class="btn btn-danger hidden" onclick="logoutAdmin()" id="admin-logout-btn">
                <i class="fa-solid fa-unlock"></i> Kilépés
            </button>
        </div>
    </header>

    <main class="container">
        
        <!-- FŐ ÉLŐ IDŐZÍTŐ KIJELZŐ -->
        <div class="timer-display">
            <div id="current-time-clock">12:00:00</div>
            
            <div class="status-box">
                <h2 id="current-event-name">Betöltés...</h2>
                <div class="countdown-big" id="time-left">--:--</div>
                <p class="sub-text" id="event-times">--:-- től --:-- ig</p>
                
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-bar" style="width: 0%;"></div>
                </div>
            </div>
        </div>

        <!-- CSENGETÉSI REND LISTA -->
        <div class="schedule-section">
            <div class="section-header">
                <h3><i class="fa-solid fa-list"></i> Napi Csengetési Rend</h3>
                <button class="btn btn-primary hidden admin-only" onclick="openAddModal()">
                    <i class="fa-solid fa-plus"></i> Új időszak
                </button>
            </div>
            
            <div class="schedule-list" id="schedule-container">
                <!-- A JS generálja ide az órákat/szüneteket -->
            </div>
            
            <div class="admin-actions hidden admin-only" style="margin-top: 20px; text-align: center;">
                <button class="btn btn-outline" onclick="resetSchedule()">Gyári csengetési rend visszaállítása</button>
            </div>
        </div>

    </main>

    <!-- ADMIN BEJELENTKEZŐ MODÁL -->
    <div id="auth-modal" class="modal-bg hidden">
        <div class="modal">
            <button class="close-btn" onclick="closeModal('auth-modal')">&times;</button>
            <h3>Admin Belépés</h3>
            <p style="font-size: 0.9rem; margin-bottom: 15px; color: var(--text-muted);">Alapértelmezett PIN: 1234</p>
            <input type="password" id="pin-input" placeholder="PIN kód">
            <p id="pin-error" class="error-msg hidden">Hibás PIN kód!</p>
            <button class="btn btn-primary" style="width: 100%; margin-top: 15px;" onclick="checkPin()">Belépés</button>
        </div>
    </div>

    <!-- IDŐSZAK SZERKESZTŐ / HOZZÁADÓ MODÁL -->
    <div id="edit-modal" class="modal-bg hidden">
        <div class="modal">
            <button class="close-btn" onclick="closeModal('edit-modal')">&times;</button>
            <h3 id="edit-modal-title">Időszak Szerkesztése</h3>
            
            <input type="hidden" id="edit-id">
            
            <label>Név (pl. 1. Óra, Szünet)</label>
            <input type="text" id="edit-name" placeholder="Óra vagy szünet neve">
            
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <div style="flex: 1;">
                    <label>Kezdés</label>
                    <input type="time" id="edit-start" required>
                </div>
                <div style="flex: 1;">
                    <label>Vége</label>
                    <input type="time" id="edit-end" required>
                </div>
            </div>
            
            <label style="margin-top: 10px; display: block;">Típus</label>
            <select id="edit-type">
                <option value="class">📚 Tanítási Óra</option>
                <option value="break">☕ Szünet</option>
            </select>

            <button class="btn btn-primary" style="width: 100%; margin-top: 20px;" onclick="saveScheduleItem()">Mentés</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
