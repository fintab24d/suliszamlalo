<!DOCTYPE html>
<html lang="hu" data-theme="cyber">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuliDash - Számláló Központ</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Fejléc -->
    <header class="navbar">
        <div class="nav-container">
            <div class="brand">
                <div class="brand-icon"><i class="fa-solid fa-calculator"></i></div>
                <div>
                    <h1>SuliDash</h1>
                    <p class="subtext">Osztály Számláló Központ</p>
                </div>
            </div>

            <div class="nav-actions">
                <select id="theme-select" onchange="changeTheme(this.value)" class="theme-dropdown">
                    <option value="cyber">⚡ Cyber (Sötét)</option>
                    <option value="sunset">🌅 Sunset (Meleg)</option>
                    <option value="light">☁️ Light (Világos)</option>
                </select>

                <div id="admin-status" class="status-badge guest">
                    <i class="fa-solid fa-user"></i> <span>Vendég</span>
                </div>

                <button id="auth-btn" onclick="openModal('auth-modal')" class="btn btn-primary">
                    <i class="fa-solid fa-lock" id="auth-icon"></i> <span id="auth-text">Admin</span>
                </button>
                
                <!-- Admin Beállítások Gomb -->
                <button onclick="openModal('settings-modal')" class="btn btn-outline btn-admin-only hidden" title="Beállítások">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Fő tartalom -->
    <main class="main-container">
        
        <!-- Eszköztár (Keresés, Szűrés) -->
        <div class="toolbar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Keresés a számlálók között..." oninput="renderCounters()">
            </div>
            
            <div class="filters">
                <select id="category-filter" onchange="renderCounters()">
                    <option value="all">Minden kategória</option>
                    <option value="study">📚 Tanulás & Jegyek</option>
                    <option value="behavior">⚠️ Fegyelem & Késés</option>
                    <option value="fun">🎉 Közösség & Móka</option>
                </select>
                
                <select id="sort-select" onchange="renderCounters()">
                    <option value="newest">Legújabb elöl</option>
                    <option value="highest">Legmagasabb érték</option>
                    <option value="lowest">Legalacsonyabb érték</option>
                </select>

                <button onclick="openModal('counter-modal')" class="btn btn-emerald btn-admin-only hidden">
                    <i class="fa-solid fa-plus"></i> Új Számláló
                </button>
            </div>
        </div>

        <!-- Számlálók Rácsa -->
        <div class="counters-grid" id="counters-container">
            <!-- A JavaScript ide generálja a kártyákat -->
        </div>

    </main>

    <!-- ================= MODÁLOK ================= -->

    <!-- Admin Bejelentkezés Modal -->
    <div id="auth-modal" class="modal-backdrop hidden">
        <div class="modal">
            <button onclick="closeModal('auth-modal')" class="modal-close">&times;</button>
            <h3><i class="fa-solid fa-shield-halved text-primary"></i> Admin Belépés</h3>
            <p class="subtext">Szerkesztéshez add meg a PIN kódot (Alap: <strong>1234</strong>)</p>
            <form onsubmit="handleAuthSubmit(event)">
                <input type="password" id="pin-input" placeholder="PIN Kód" required autofocus>
                <div id="auth-error" class="error-msg hidden">Hibás PIN kód!</div>
                <button type="submit" class="btn btn-primary w-full mt-3">Belépés</button>
            </form>
        </div>
    </div>

    <!-- Új/Szerkesztés Számláló Modal -->
    <div id="counter-modal" class="modal-backdrop hidden">
        <div class="modal">
            <button onclick="closeModal('counter-modal')" class="modal-close">&times;</button>
            <h3 id="modal-counter-title">Új Számláló</h3>
            <form onsubmit="saveCounter(event)">
                <input type="hidden" id="c-id">
                <input type="text" id="c-title" placeholder="Megnevezés (pl. Késések)" required>
                
                <div class="flex-row">
                    <input type="text" id="c-icon" placeholder="Emoji (pl. ⏰)" value="⭐" required style="width:30%">
                    <select id="c-category" required style="width:70%">
                        <option value="study">📚 Tanulás & Jegyek</option>
                        <option value="behavior">⚠️ Fegyelem & Késés</option>
                        <option value="fun">🎉 Közösség & Móka</option>
                    </select>
                </div>
                
                <div class="flex-row">
                    <input type="number" id="c-value" placeholder="Kezdőérték" value="0" required>
                    <input type="number" id="c-step" placeholder="Lépésköz (pl. 1)" value="1" required>
                </div>

                <input type="number" id="c-max" placeholder="Cél (opcionális, pl. 100)" min="1">
                
                <select id="c-color">
                    <option value="primary">Kék (Alap)</option>
                    <option value="emerald">Zöld (Pozitív)</option>
                    <option value="rose">Piros (Negatív)</option>
                    <option value="gold">Sárga (Figyelem)</option>
                </select>

                <button type="submit" class="btn btn-emerald w-full mt-3">Mentés</button>
            </form>
        </div>
    </div>

    <!-- Beállítások / Adatkezelés Modal -->
    <div id="settings-modal" class="modal-backdrop hidden">
        <div class="modal">
            <button onclick="closeModal('settings-modal')" class="modal-close">&times;</button>
            <h3><i class="fa-solid fa-gears"></i> Rendszer Beállítások</h3>
            <div class="flex-col gap-2 mt-3">
                <button onclick="changePinCode()" class="btn btn-outline w-full"><i class="fa-solid fa-key"></i> PIN Kód Módosítása</button>
                <hr style="border-color: var(--border-color); margin: 10px 0;">
                <button onclick="exportData()" class="btn btn-primary w-full"><i class="fa-solid fa-download"></i> Adatok Mentése (JSON)</button>
                <button onclick="document.getElementById('import-file').click()" class="btn btn-outline w-full"><i class="fa-solid fa-upload"></i> Adatok Betöltése</button>
                <input type="file" id="import-file" style="display:none" onchange="importData(event)">
                <button onclick="resetToDefault()" class="btn btn-danger w-full mt-3"><i class="fa-solid fa-rotate-left"></i> Gyári Visszaállítás</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
